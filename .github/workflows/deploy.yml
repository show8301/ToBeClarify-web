name: Web CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ (github.ref == 'refs/heads/dev' || github.base_ref == 'dev') && vars.DEV_VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_ADMIN_API_BASE_URL: ${{ (github.ref == 'refs/heads/dev' || github.base_ref == 'dev') && vars.DEV_VITE_ADMIN_API_BASE_URL || vars.VITE_ADMIN_API_BASE_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tobeclarify-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to IIS
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))) &&
        (github.ref != 'refs/heads/dev' ||
          (vars.DEV_WEB_DEPLOY_PATH != '' && vars.DEV_WEB_HEALTHCHECK_URL != ''))
      }}
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tobeclarify-web-dist
          path: ${{ runner.temp }}\tobeclarify-web-dist

      - name: Deploy Web files
        shell: powershell
        env:
          ARTIFACT_PATH: ${{ runner.temp }}\tobeclarify-web-dist
          DEPLOY_PATH: ${{ github.ref == 'refs/heads/dev' && vars.DEV_WEB_DEPLOY_PATH || vars.WEB_DEPLOY_PATH }}
          HEALTH_CHECK_URL: ${{ github.ref == 'refs/heads/dev' && vars.DEV_WEB_HEALTHCHECK_URL || vars.WEB_HEALTHCHECK_URL }}
          EXPECTED_DEPLOY_LEAF: ${{ github.ref == 'refs/heads/dev' && 'ToBeClarify_web_dev' || 'ToBeClarify_web' }}
        run: .\scripts\deploy-iis.ps1 -ArtifactPath $env:ARTIFACT_PATH -DeployPath $env:DEPLOY_PATH -HealthCheckUrl $env:HEALTH_CHECK_URL -ExpectedDeployLeaf $env:EXPECTED_DEPLOY_LEAF
