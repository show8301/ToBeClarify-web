name: Vinext Web CI/CD

# Development deployments intentionally skip all automated test suites. Keep any
# future test workflow separate and excluded from dev unless explicitly requested.

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check the selected branch runner and IIS prerequisites without deploying
        required: true
        default: false
        type: boolean
      allow_one_time_url_rewrite_install:
        description: Allow one LocalSystem task to install signed Microsoft URL Rewrite
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0
  ARTIFACT_NAME: tobeclarify-vinext-web

jobs:
  build:
    name: Clean install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vinext-${{ github.ref_name }}-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -Path scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            foreach ($error in $errors) {
              $parseErrors += "$($_.Name):$($error.Extent.StartLineNumber): $($error.Message)"
            }
          }

          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host "PowerShell parser error: $_" }
            throw 'One or more PowerShell deployment scripts contain syntax errors.'
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build deployable application
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm run build

      - name: Upload deployable Vinext application
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preflight_only != true)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist
            package.json
            package-lock.json
            deploy/web.config.template
            scripts/start-vinext.ps1
          if-no-files-found: error
          retention-days: 7

  validate-production-promotion:
    name: Require dev-to-main promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the tested dev branch as the production source
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Production Web pull requests must use dev as the source branch."
            echo "Deploy the change to dev and obtain confirmation before opening dev -> main."
            exit 1
          fi
          echo "Accepted production promotion: dev -> main."

  deploy:
    name: Preflight and deploy to IIS
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    concurrency:
      group: vinext-${{ github.ref_name }}-iis-deployment
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Select and validate deployment target
        shell: powershell
        env:
          BRANCH_REF: ${{ github.ref }}
          DEV_DEPLOY_PATH: ${{ vars.DEV_WEB_DEPLOY_PATH }}
          DEV_HEALTH_CHECK_URL: ${{ vars.DEV_WEB_HEALTHCHECK_URL }}
          DEV_NODE_PORT: ${{ vars.DEV_NODE_PORT }}
          DEV_NODE_TASK_NAME: ${{ vars.DEV_NODE_TASK_NAME }}
          DEV_ADMIN_API_BASE_URL: ${{ vars.DEV_ADMIN_API_BASE_URL }}
          DEV_PUBLIC_MEDIA_BASE_URL: ${{ vars.DEV_PUBLIC_MEDIA_BASE_URL }}
          DEV_PUBLIC_CLIENT_API_BASE_URL: ${{ vars.DEV_PUBLIC_CLIENT_API_BASE_URL }}
          DEV_ORDERING_API_BASE_URL: ${{ vars.DEV_ORDERING_API_BASE_URL }}
          PROD_DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH }}
          PROD_HEALTH_CHECK_URL: ${{ vars.WEB_HEALTHCHECK_URL }}
          PROD_NODE_PORT: ${{ vars.WEB_NODE_PORT }}
          PROD_NODE_TASK_NAME: ${{ vars.WEB_NODE_TASK_NAME }}
          PROD_ADMIN_API_BASE_URL: ${{ vars.WEB_ADMIN_API_BASE_URL }}
          PROD_PUBLIC_MEDIA_BASE_URL: ${{ vars.WEB_PUBLIC_MEDIA_BASE_URL }}
          PROD_PUBLIC_CLIENT_API_BASE_URL: ${{ vars.WEB_PUBLIC_CLIENT_API_BASE_URL }}
          PROD_ORDERING_API_BASE_URL: ${{ vars.WEB_ORDERING_API_BASE_URL }}
        run: |
          if ($env:BRANCH_REF -eq 'refs/heads/main') {
            $targetName = 'production'
            $deployPathVariable = 'WEB_DEPLOY_PATH'
            $healthCheckVariable = 'WEB_HEALTHCHECK_URL'
            $deployPath = $env:PROD_DEPLOY_PATH
            $healthCheckUrl = $env:PROD_HEALTH_CHECK_URL
            $nodePort = if ([string]::IsNullOrWhiteSpace($env:PROD_NODE_PORT)) { '4300' } else { $env:PROD_NODE_PORT }
            $taskName = if ([string]::IsNullOrWhiteSpace($env:PROD_NODE_TASK_NAME)) { 'ToBeClarify Vinext PROD' } else { $env:PROD_NODE_TASK_NAME }
            $adminApiBaseUrl = $env:PROD_ADMIN_API_BASE_URL
            $publicMediaBaseUrl = $env:PROD_PUBLIC_MEDIA_BASE_URL
            $publicClientApiBaseUrl = $env:PROD_PUBLIC_CLIENT_API_BASE_URL
            $orderingApiBaseUrl = $env:PROD_ORDERING_API_BASE_URL
            $expectedDeployLeaf = 'ToBeClarify_web'
          }
          elseif ($env:BRANCH_REF -eq 'refs/heads/dev') {
            $targetName = 'development'
            $deployPathVariable = 'DEV_WEB_DEPLOY_PATH'
            $healthCheckVariable = 'DEV_WEB_HEALTHCHECK_URL'
            $deployPath = $env:DEV_DEPLOY_PATH
            $healthCheckUrl = $env:DEV_HEALTH_CHECK_URL
            $nodePort = if ([string]::IsNullOrWhiteSpace($env:DEV_NODE_PORT)) { '4310' } else { $env:DEV_NODE_PORT }
            $taskName = if ([string]::IsNullOrWhiteSpace($env:DEV_NODE_TASK_NAME)) { 'ToBeClarify Vinext DEV' } else { $env:DEV_NODE_TASK_NAME }
            $adminApiBaseUrl = $env:DEV_ADMIN_API_BASE_URL
            $publicMediaBaseUrl = $env:DEV_PUBLIC_MEDIA_BASE_URL
            $publicClientApiBaseUrl = $env:DEV_PUBLIC_CLIENT_API_BASE_URL
            $orderingApiBaseUrl = $env:DEV_ORDERING_API_BASE_URL
            $expectedDeployLeaf = 'ToBeClarify_web_dev'
          }
          else {
            throw "Deployment is not allowed from branch ref $($env:BRANCH_REF)."
          }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($deployPath)) { $missing += $deployPathVariable }
          if ([string]::IsNullOrWhiteSpace($healthCheckUrl)) { $missing += $healthCheckVariable }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions repository variables for ${targetName}: $($missing -join ', ')"
          }

          $parsedPort = 0
          if (-not [int]::TryParse($nodePort, [ref]$parsedPort) -or $parsedPort -lt 1024 -or $parsedPort -gt 65535) {
            throw "Invalid Node port for ${targetName}: $nodePort"
          }

          @(
            "DEPLOY_TARGET=$targetName"
            "DEPLOY_PATH=$deployPath"
            "HEALTH_CHECK_URL=$healthCheckUrl"
            "NODE_PORT=$parsedPort"
            "NODE_TASK_NAME=$taskName"
            "ADMIN_API_BASE_URL=$adminApiBaseUrl"
            "PUBLIC_MEDIA_BASE_URL=$publicMediaBaseUrl"
            "PUBLIC_CLIENT_API_BASE_URL=$publicClientApiBaseUrl"
            "ORDERING_API_BASE_URL=$orderingApiBaseUrl"
            "EXPECTED_DEPLOY_LEAF=$expectedDeployLeaf"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Microsoft IIS URL Rewrite when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.allow_one_time_url_rewrite_install
        shell: powershell
        run: .\scripts\install-iis-url-rewrite.ps1 -AllowLocalSystemInstall

      - name: Check runner and IIS prerequisites
        shell: powershell
        run: |
          .\scripts\test-iis-reverse-proxy-prerequisites.ps1 `
            -DeployPath $env:DEPLOY_PATH `
            -MinimumNodeVersion '${{ env.NODE_VERSION }}'

      - name: Download Vinext application
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preflight_only != true)
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}\tobeclarify-vinext-web

      - name: Deploy Node runtime and configure IIS reverse proxy
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preflight_only != true)
        shell: powershell
        env:
          ARTIFACT_PATH: ${{ runner.temp }}\tobeclarify-vinext-web
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          .\scripts\deploy-vinext-iis.ps1 `
            -ArtifactPath $env:ARTIFACT_PATH `
            -DeployPath $env:DEPLOY_PATH `
            -HealthCheckUrl $env:HEALTH_CHECK_URL `
            -ExpectedDeployLeaf $env:EXPECTED_DEPLOY_LEAF `
            -NodePort ([int]$env:NODE_PORT) `
            -TaskName $env:NODE_TASK_NAME `
            -DeploymentSha $env:DEPLOYMENT_SHA `
            -AdminApiBaseUrl $env:ADMIN_API_BASE_URL `
            -PublicMediaBaseUrl $env:PUBLIC_MEDIA_BASE_URL `
            -PublicClientApiBaseUrl $env:PUBLIC_CLIENT_API_BASE_URL `
            -OrderingApiBaseUrl $env:ORDERING_API_BASE_URL
